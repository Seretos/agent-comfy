[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy_plugin"
version = "0.0.0"
description = "MCP server for driving ComfyUI - submit workflows, manage the prompt queue, and fetch generated images"
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2",
  "lib-python-comfy @ git+https://github.com/Seretos/lib-python-comfy@v0.0.3",
  "httpx>=0.27",
  "pydantic>=2",
  "Pillow>=10",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
