name: release

# Multi-OS release pipeline (default OS_TARGETS = [windows, linux]).
#
# Shape: Stamp -> Matrix-Build (one job per OS) -> Assembly.
#   1. stamp:   one-shot Linux runner stamps version into pyproject.toml +
#               plugin.json and uploads them as an artifact so every build
#               job pulls the same stamped sources.
#   2. build:   matrix job; one runner per OS. Each runs scripts/build.ps1
#               (cross-platform pwsh) and uploads its bin/ tree as an
#               OS-tagged artifact.
#   3. assemble: Linux runner downloads all per-OS bins, merges them into a
#               single staging tree, builds the release zip with correct
#               Unix mode bits (Python zipfile), force-pushes the orphan
#               `release` branch, creates the GitHub Release, and dispatches
#               to the marketplace.
#
# plugin.json uses an extensionless `command: ${CLAUDE_PLUGIN_ROOT}/bin/comfy`
# — the host OS auto-resolves to `comfy.exe` on Windows and
# `comfy` on Linux, so a single zip serves both platforms.
#
# Windows-only override: if this plugin is genuinely Win32-bound (COM / pyvda
# / pywin32 etc.), drop the ubuntu-22.04 row from the matrix below, remove
# the Linux-binary assertions in the assemble job, and revert plugin.json's
# command back to `bin/comfy.exe`. See AGENTS.md "OS_TARGETS".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write
  # Needed for "Generate release notes from main history"'s src/<tag>
  # backfill push: it tags a historical main commit whose .github/workflows/
  # content differs from the current tip, which GITHUB_TOKEN otherwise
  # refuses to push ("refusing to allow a GitHub App to create or update
  # workflow ... without workflows permission").
  workflows: write

jobs:
  # ------------------------------------------------------------------
  # 1. Stamp version + share the stamped source tree.
  # ------------------------------------------------------------------
  stamp:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      plugin_name: ${{ steps.meta.outputs.plugin_name }}
      tag:         ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          ONE_ID='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-${ONE_ID}(\.${ONE_ID})*)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Stamp version into pyproject.toml + plugin manifests
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # pyproject.toml — first `version = "..."` line wins.
          sed -i -E "0,/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/s//version = \"$V\"/" pyproject.toml
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"
          grep '^version' pyproject.toml
          grep '"version"' .claude-plugin/plugin.json
          grep '"version"' .codex-plugin/plugin.json

      - name: Export plugin metadata
        id: meta
        shell: bash
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          echo "plugin_name=${PLUGIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"

      - name: Upload stamped source tree
        uses: actions/upload-artifact@v4
        with:
          name: stamped-source
          # v4 excludes dotfiles/dotdirs by default; downstream jobs need
          # .claude-plugin/ + .codex-plugin/ (and .github/, .gitattributes etc.)
          # in the downloaded tree to build and assemble the release.
          include-hidden-files: true
          path: |
            .
            !.git
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 2. Matrix build — one binary per OS, each uploaded as an artifact.
  # ------------------------------------------------------------------
  build:
    needs: stamp
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Download stamped source
        uses: actions/download-artifact@v4
        with:
          name: stamped-source

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Build binary + stage payload (${{ matrix.target }})
        shell: pwsh
        run: ./scripts/build.ps1 -Clean -Package

      - name: Upload OS-tagged bin payload
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Assembly — merge per-OS binaries, push release branch, publish.
  # ------------------------------------------------------------------
  assemble:
    needs: [stamp, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for orphan branch push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stamped source
        uses: actions/download-artifact@v4
        with:
          name: stamped-source
          path: stamped/

      - name: Download all per-OS bins
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins/
          merge-multiple: false

      - name: Build merged staging tree
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-comfy"
          mkdir -p "$STAGE"

          # Copy the install-ready, non-binary parts from the stamped tree.
          cp -a stamped/.claude-plugin "$STAGE/"
          [ -d stamped/.codex-plugin ] && cp -a stamped/.codex-plugin "$STAGE/" || true
          [ -f stamped/README.md ] && cp -a stamped/README.md "$STAGE/" || true
          [ -f stamped/LICENSE   ] && cp -a stamped/LICENSE   "$STAGE/" || true
          if [ -d stamped/skills ]; then
            cp -a stamped/skills "$STAGE/"
          fi
          # assets/ goes onto the orphan release branch alongside the binaries,
          # so the dispatch payload's icon URL
          # (raw.githubusercontent.com/${repo}/${TAG}/assets/icon.png) resolves.
          [ -d stamped/assets ] && cp -a stamped/assets "$STAGE/" || true
          # description.md ships onto the orphan release branch too, so the
          # dispatch payload's description_url
          # (raw.githubusercontent.com/${repo}/${TAG}/description.md) resolves.
          [ -f stamped/description.md ] && cp -a stamped/description.md "$STAGE/" || true

          # Merge every per-OS bin payload. Each build job uploads to
          # bins/bin-<os>/ which contains the OS-specific binary
          # (`comfy.exe` from Windows, `comfy` from Linux).
          mkdir -p "$STAGE/bin"
          shopt -s nullglob
          for d in bins/bin-*/; do
            echo "Merging $d -> $STAGE/bin/"
            cp -a "$d"/* "$STAGE/bin/"
          done

          echo "=== merged bin/ ==="
          ls -la "$STAGE/bin"

          # Assert both binaries got picked up. Drop one of these branches
          # if you reduce OS_TARGETS to a single OS.
          if [ ! -f "$STAGE/bin/comfy.exe" ]; then
            echo "::error::missing Windows binary in merged stage"; exit 1
          fi
          if [ ! -f "$STAGE/bin/comfy" ]; then
            echo "::error::missing Linux binary in merged stage"; exit 1
          fi
          chmod +x "$STAGE/bin/comfy"

          ZIP="dist/agent-comfy-${{ inputs.version }}.zip"
          mkdir -p dist
          # Use Python's zipfile so we can stamp Unix mode bits into the
          # central directory — required so the Linux binary keeps its
          # exec bit after `unzip` on Linux/macOS.
          python3 - "$STAGE" "$ZIP" <<'PY'
          import os, sys, time, zipfile
          stage, zip_path = sys.argv[1], sys.argv[2]
          EXECS = {"bin/comfy", "bin/comfy.exe"}
          EXE_ATTR = (0o755 << 16) | 0x8000  # S_IFREG | 0755
          REG_ATTR = (0o644 << 16) | 0x8000
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for dirpath, dirnames, filenames in os.walk(stage):
                  dirnames.sort()
                  for name in sorted(filenames):
                      abs_path = os.path.join(dirpath, name)
                      rel = os.path.relpath(abs_path, stage).replace(os.sep, "/")
                      st = os.stat(abs_path)
                      mtime = time.localtime(st.st_mtime)[:6]
                      zi = zipfile.ZipInfo(filename=rel, date_time=mtime)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.create_system = 3  # Unix
                      zi.external_attr = EXE_ATTR if rel in EXECS else REG_ATTR
                      with open(abs_path, "rb") as fh:
                          zf.writestr(zi, fh.read())
          print(f"wrote {zip_path} ({os.path.getsize(zip_path)} bytes)")
          PY

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "asset=$ZIP"   >> "$GITHUB_OUTPUT"

      - name: Generate release notes from main history
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The orphan release tag we're about to create shares no
          # merge-base with `main` or any prior release tag (each release is
          # a fresh parentless commit under `git checkout --orphan`), so
          # `gh release create --generate-notes`/`--notes-start-tag` can only
          # ever see a single commit and would emit an empty changelog. We
          # tag the current `main` commit as `src/<TAG>` (and backfill
          # `src/<PREV_TAG>` if it doesn't exist yet) so the notes API has
          # two commits that genuinely share `main`'s history to diff.
          git fetch --tags --force origin
          MAIN_SHA=$(git rev-parse HEAD)
          TAG="${{ needs.stamp.outputs.tag }}"
          PREV_TAG_SHORT=$(.github/scripts/prev-release-tag.sh "$TAG")
          NOTES_DIR=$(mktemp -d)
          SCRIPTS_DIR=$(mktemp -d)
          # Copy out of the git worktree so it survives the later
          # `git clean -fdx` in "Push orphan release branch".
          cp .github/scripts/marketplace-payload.sh "$SCRIPTS_DIR/"

          if ! git rev-parse -q --verify "refs/tags/src/$TAG" >/dev/null; then
            git tag "src/$TAG" "$MAIN_SHA"
            git push origin "src/$TAG"
          fi

          PREV_ARGS=()
          if [ -n "$PREV_TAG_SHORT" ]; then
            if ! git rev-parse -q --verify "refs/tags/src/$PREV_TAG_SHORT" >/dev/null; then
              # Backfill: find the main commit at/just-before the previous
              # release's commit time.
              #
              # This commit-time heuristic is a known, accepted, one-time
              # approximation (plan.md, package #53, Approach section) —
              # every already-published release predates the src/<tag>
              # marker scheme, so this only fires once per predecessor tag
              # to backfill its marker, then self-retires (a release that
              # already has its own src/<tag> marker never re-enters this
              # branch). It affects only the cosmetic src/…...src/… compare
              # range shown in generated release notes, never the
              # orphan-branch/tag/dispatch correctness paths. Raised and
              # accepted twice already (review rounds 1 and 3) as
              # intentional, plan-disclosed design — do not "fix" this
              # without first updating the plan.
              PREV_COMMIT_TIME=$(git log -1 --format=%cI "$PREV_TAG_SHORT")
              BACKFILL_SHA=$(git rev-list -1 --before="$PREV_COMMIT_TIME" "$MAIN_SHA")
              if [ -n "$BACKFILL_SHA" ]; then
                git tag "src/$PREV_TAG_SHORT" "$BACKFILL_SHA"
                git push origin "src/$PREV_TAG_SHORT"
              fi
            fi
            if git rev-parse -q --verify "refs/tags/src/$PREV_TAG_SHORT" >/dev/null; then
              PREV_ARGS=(-f "previous_tag_name=src/$PREV_TAG_SHORT")
            fi
          fi

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=src/$TAG" -f "target_commitish=$MAIN_SHA" \
            "${PREV_ARGS[@]}" --jq .body > "$NOTES_DIR/notes.md"

          echo "notes_file=$NOTES_DIR/notes.md" >> "$GITHUB_OUTPUT"
          echo "scripts_dir=$SCRIPTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.asset }}"

          # Stash staging + zip outside the worktree before `checkout --orphan`
          # wipes everything.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          # Stamp +x on both binaries so a Linux clone of the orphan release
          # branch yields executable files (matters for WSL/Linux installs).
          git add bin/comfy.exe bin/comfy
          git update-index --chmod=+x bin/comfy.exe
          git update-index --chmod=+x bin/comfy
          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.stamp.outputs.tag }}"
          # The orphan release tag shares no merge-base with `main` or any
          # prior release tag (each release is a fresh parentless commit),
          # so `--generate-notes` can only ever see a single commit and
          # would emit an empty changelog. Use the notes generated from the
          # `src/*` marker tags (which do share `main`'s history) instead.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          VERSION:  ${{ inputs.version }}
          NAME:     ${{ needs.stamp.outputs.plugin_name }}
          TAG:      ${{ needs.stamp.outputs.tag }}
        run: |
          # The "Push orphan release branch" step above ran `git clean -fdx`,
          # which deleted the untracked `stamped/` artifact dir. Read the
          # (already version-stamped) manifest from the orphan release branch's
          # working tree instead — it sits at the repo root now.
          export DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          # The release/tag already exist at this point in the job, so a
          # failure reading the release body is safe to fail the whole step
          # on — it's re-runnable via dispatch.yml.
          #
          # Command substitution strips ALL trailing newlines from its
          # output. Append a sentinel char before capturing, then strip it
          # off, so a release body's trailing newlines survive intact. This
          # MUST be joined with `&&`, not `;`: bash does not inherit
          # `errexit` into a `$(...)` subshell by default (no
          # `inherit_errexit`), so a `;`-joined sentinel would let `printf`
          # run even after `gh release view` fails, silently swallowing the
          # failure instead of aborting the step. `&&` short-circuits before
          # `printf` on failure, so the subshell's exit status is still
          # `gh release view`'s, and the step still fails loudly.
          CHANGELOG=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          # `--jq .body` (jq's -r mode) always appends its own trailing
          # newline after the value, independent of the body's own content.
          # Strip exactly one trailing newline to undo that: an empty body
          # collapses to "" (so marketplace-payload.sh's `$changelog == ""`
          # check still omits the key) and a non-empty body loses only jq's
          # synthetic newline. If the body's own text also ends in a real
          # newline, this is indistinguishable from jq's and gets stripped
          # too — an accepted limitation for a changelog-display field.
          export CHANGELOG="${CHANGELOG%$'\n'}"
          "${{ steps.notes.outputs.scripts_dir }}/marketplace-payload.sh" | curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            --data-binary @-
