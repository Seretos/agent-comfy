name: dispatch-to-marketplace

# Manual recovery tool. The normal release flow (release.yml) dispatches to
# the marketplace itself. Use this only when:
#   - The marketplace dispatch step in release.yml failed and you want to
#     retry without re-running the whole build.
#   - You need to re-publish an existing release to the marketplace (e.g.
#     after the marketplace.json schema changed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dispatch (e.g. agent-comfy--v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          # Tag format: <plugin-name>--v<version>. Strip everything up to and including "--v".
          VERSION="${TAG##*--v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      # The primary checkout above is `ref: release`, which carries no
      # `.github/` directory at all (the orphan release branch only holds
      # install-ready files). Sparse-checkout `main`'s scripts separately so
      # marketplace-payload.sh is reachable.
      - name: Checkout release-scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci
          sparse-checkout: .github/scripts

      - name: Verify plugin.json version matches tag
        shell: bash
        run: |
          PJ_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json on release branch is v$PJ_VERSION, but you asked to dispatch v$TAG_VERSION."
            echo "Re-run release.yml with version=$TAG_VERSION (or re-check the release branch state)."
            exit 1
          fi

      - name: Read plugin metadata from plugin.json
        id: meta
        shell: bash
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"        >> "$GITHUB_OUTPUT"

      - name: Dispatch to agent-marketplace
        env:
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          NAME:     ${{ steps.meta.outputs.name }}
          DESC:     ${{ steps.meta.outputs.description }}
          VERSION:  ${{ steps.tag.outputs.version }}
          TAG:      ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          # The release being re-dispatched is already published, so just
          # read its notes body straight from the release — no `src/*`/
          # `MAIN_SHA` marker-tag logic needed here.
          #
          # Command substitution strips ALL trailing newlines from its
          # output. Append a sentinel char before capturing, then strip it
          # off, so a release body's trailing newlines survive intact. This
          # MUST be joined with `&&`, not `;`: bash does not inherit
          # `errexit` into a `$(...)` subshell by default (no
          # `inherit_errexit`), so a `;`-joined sentinel would let `printf`
          # run even after `gh release view` fails, silently swallowing the
          # failure instead of aborting the step. `&&` short-circuits before
          # `printf` on failure, so the subshell's exit status is still
          # `gh release view`'s, and the step still fails loudly.
          CHANGELOG=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          # `--jq .body` (jq's -r mode) always appends its own trailing
          # newline after the value, independent of the body's own content.
          # Strip exactly one trailing newline to undo that: an empty body
          # collapses to "" (so marketplace-payload.sh's `$changelog == ""`
          # check still omits the key) and a non-empty body loses only jq's
          # synthetic newline. If the body's own text also ends in a real
          # newline, this is indistinguishable from jq's and gets stripped
          # too — an accepted limitation for a changelog-display field.
          export CHANGELOG="${CHANGELOG%$'\n'}"
          ci/.github/scripts/marketplace-payload.sh | curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            --data-binary @-
